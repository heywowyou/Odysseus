packages:
  - 'packages/*'
  - 'fixtures/*'
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  es5-ext: false
  esbuild: true
minimumReleaseAgeExclude:
  - dependency-cruiser@18.3.0
overrides:
  # lodash.pick's GHSA-p6mc-m468-83gw has no fix: the registry never
  # published a version past 4.4.0 despite the advisory naming 4.4.1 as
  # patched. Deep transitive dep of structured-data-testing-tool via
  # web-auto-extractor/cheerio; left unpatched, tracked for a future
  # structured-data-testing-tool major bump or replacement.
  'nth-check@<2.0.1': '>=2.0.1'
  'validator@<13.15.22': '>=13.15.22'
  # CVE-2026-67213: denial of service via infinite loop in random ID
  # generation. Transitive through postcss (build-time only, not on any
  # runtime request path), pulled in by next and tailwindcss/vite; surfaced
  # by the Trivy dependency scan added for issue #255.
  'nanoid@<3.3.18': '^3.3.18'
packageExtensions:
  # Issue #29: react-router ships d.ts that import React's types but
  # declares no @types/react of its own, so its declaration resolution fell
  # through to pnpm's virtual-store hoist, where exactly one @types/react
  # wins per package name regardless of which majors the workspace actually
  # uses. With @types/react 18 (the spa-demo fixture's pin) in that slot,
  # the dashboard project compiled its own code against 19 while
  # react-router's exported prop types carried the 18 ReactNode union, and
  # the two are mutually unassignable. Declaring the types packages here
  # pins react-router's own resolution to the same 19 copies the dashboard
  # and site already use, so no future reinstall can flip the winner.
  # Scoped to the 8.x line: a react-router major may target a different
  # React and must re-decide this deliberately. Deliberately not a hoist
  # exclusion: with @types/react removed from the hoist and no root-level
  # declaration, react-router (and lucide-react, which also declares no
  # @types/react) would resolve no React types at all and silently degrade
  # to any under skipLibCheck.
  'react-router@>=8.3 <9':
    dependencies:
      '@types/react': ^19.2.18
      '@types/react-dom': ^19.2.5
