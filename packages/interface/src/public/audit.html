<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odysseus</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <span class="brand">Odysseus</span>
      <nav>
        <a href="/index.html" data-i18n="nav.newScan">New scan</a>
        <a href="/history.html" data-i18n="nav.history">History</a>
      </nav>
    </header>
    <main>
      <h1 data-i18n="auditDetail.heading">Audit detail</h1>
      <div class="error-banner" id="error-banner"></div>

      <section class="card">
        <div class="meta-row">
          <span><strong data-i18n="auditDetail.siteLabel">Site</strong>: <span id="meta-site"></span></span>
          <span><strong data-i18n="auditDetail.dateLabel">Date</strong>: <span id="meta-date"></span></span>
          <span><strong data-i18n="auditDetail.pagesVisitedLabel">Pages visited</strong>: <span id="meta-pages"></span></span>
        </div>
        <div class="rollup" id="rollup"></div>
      </section>

      <h2 data-i18n="auditDetail.reportsHeading">Reports</h2>
      <section class="card" id="reports-card">
        <p class="empty-state" id="no-reports" data-i18n="auditDetail.noReportsYet" hidden>No report generated yet.</p>
        <div id="report-links"></div>
      </section>

      <h2 data-i18n="auditDetail.manualFieldsHeading">Enrichment</h2>
      <section class="card">
        <p class="hint" data-i18n="auditDetail.manualFieldsHint"></p>
        <form id="manual-fields-form">
          <label for="mf-siren" data-i18n="auditDetail.sirenLabel">SIREN</label>
          <div class="siren-row">
            <input type="text" id="mf-siren" name="siren" inputmode="numeric" />
            <button type="button" id="siren-check-button" data-i18n="auditDetail.sirenCheckButton">Check</button>
          </div>
          <p id="siren-preview-result" class="hint"></p>

          <label for="mf-sirenSourceUrl" data-i18n="auditDetail.sirenSourceUrlLabel">Page where the SIREN is displayed</label>
          <input type="text" id="mf-sirenSourceUrl" name="sirenSourceUrl" />

          <label for="mf-raisonSociale" data-i18n="auditDetail.raisonSocialeLabel">Legal name</label>
          <input type="text" id="mf-raisonSociale" name="raisonSociale" />

          <label for="mf-nomCommercial" data-i18n="auditDetail.nomCommercialLabel">Display name</label>
          <input type="text" id="mf-nomCommercial" name="nomCommercial" />

          <label for="mf-recipientName" data-i18n="auditDetail.recipientNameLabel">Prepared for</label>
          <input type="text" id="mf-recipientName" name="recipientName" />

          <label for="mf-sector" data-i18n="auditDetail.sectorLabel">Sector</label>
          <select id="mf-sector" name="sector">
            <option value="" data-i18n="auditDetail.sectorAutoOption">Auto-detected</option>
            <option value="general" data-i18n="auditDetail.sectorGeneralOption">General</option>
            <option value="hospitality" data-i18n="auditDetail.sectorHospitalityOption">Hospitality</option>
          </select>

          <label for="mf-revenueBand" data-i18n="auditDetail.revenueBandLabel">Revenue band</label>
          <input type="text" id="mf-revenueBand" name="revenueBand" />

          <label for="mf-declarationContactEmail" data-i18n="auditDetail.declarationContactEmailLabel">Declaration contact email</label>
          <input type="text" id="mf-declarationContactEmail" name="declarationContactEmail" />

          <div class="manual-fields-actions">
            <button type="submit" id="manual-fields-save-button" data-i18n="auditDetail.saveButton">Save</button>
            <button type="button" id="regenerate-report-button" data-i18n="auditDetail.regenerateButton">Regenerate report</button>
          </div>
          <p id="manual-fields-status" class="hint"></p>
        </form>
      </section>

      <h2 data-i18n="auditDetail.findingsHeading">Findings</h2>
      <section class="card">
        <table>
          <thead>
            <tr>
              <th data-i18n="auditDetail.severityColumn">Severity</th>
              <th data-i18n="auditDetail.categoryColumn">Category</th>
              <th data-i18n="auditDetail.titleColumn">Finding</th>
              <th data-i18n="auditDetail.occurrencesColumn">Occurrences</th>
              <th data-i18n="auditDetail.pagesColumn">Affected pages</th>
            </tr>
          </thead>
          <tbody id="findings-rows"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/app-audit.js"></script>
  </body>
</html>
