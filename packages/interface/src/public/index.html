<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odysseus</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="nav">
      <span class="nav-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 3v18M3 12h18"></path>
        </svg>
        Odysseus
      </span>
      <a href="/index.html" aria-current="page" data-i18n="nav.newScan">New scan</a>
      <a href="/history.html" data-i18n="nav.history">History</a>
    </nav>
    <main>
      <h1 data-i18n="newScan.heading">New scan</h1>
      <div class="error-banner" id="error-banner"></div>

      <form class="card elev-sm" id="new-scan-form">
        <div class="seg" role="radiogroup" aria-label="Scan type">
          <label class="seg-opt">
            <input type="radio" name="type" value="full-audit" checked />
            <span data-i18n="newScan.typeFullAudit">Full audit</span>
          </label>
          <label class="seg-opt">
            <input type="radio" name="type" value="prospecting" />
            <span data-i18n="newScan.typeProspecting">Prospecting</span>
          </label>
        </div>

        <div id="full-audit-fields">
          <div class="field">
            <label for="url" data-i18n="newScan.urlLabel">Site URL</label>
            <input class="input" type="url" id="url" name="url" data-i18n-placeholder="newScan.urlPlaceholder" required />
          </div>

          <div class="field">
            <label for="siren" data-i18n="newScan.sirenLabel">SIREN (optional)</label>
            <input class="input" type="text" id="siren" name="siren" inputmode="numeric" data-i18n-placeholder="newScan.sirenPlaceholder" />
            <p class="hint" data-i18n="newScan.sirenHint"></p>
          </div>

          <div class="field">
            <label for="transactionalFlow" data-i18n="newScan.transactionalFlowLabel">
              Does this site take bookings or sell online for its own account?
            </label>
            <select class="input" id="transactionalFlow" name="transactionalFlow">
              <option value="" data-i18n="newScan.transactionalFlowAutoOption">Let the tool detect</option>
              <option value="true" data-i18n="newScan.transactionalFlowYesOption">Yes</option>
              <option value="false" data-i18n="newScan.transactionalFlowNoOption">No</option>
            </select>
          </div>
          <div class="field" id="transactional-flow-reason-field" hidden>
            <label for="transactionalFlowReason" data-i18n="newScan.transactionalFlowReasonLabel">Reason (optional)</label>
            <input
              class="input"
              type="text"
              id="transactionalFlowReason"
              name="transactionalFlowReason"
              data-i18n-placeholder="newScan.transactionalFlowReasonPlaceholder"
            />
          </div>
        </div>

        <div id="prospecting-fields" hidden>
          <div class="field">
            <label for="urls" data-i18n="newScan.urlsLabel">Site URLs</label>
            <textarea class="input" id="urls" name="urls" data-i18n-placeholder="newScan.urlsPlaceholder"></textarea>
          </div>
        </div>

        <details class="advanced" id="advanced-options">
          <summary data-i18n="newScan.advancedOptions">Advanced options</summary>
          <div class="field">
            <label for="maxPages" data-i18n="newScan.maxPagesLabel">Maximum pages</label>
            <input class="input" type="number" id="maxPages" name="maxPages" min="1" />
          </div>
          <div class="field">
            <label for="maxDepth" data-i18n="newScan.maxDepthLabel">Maximum link depth</label>
            <input class="input" type="number" id="maxDepth" name="maxDepth" min="0" />
          </div>
          <div class="field">
            <label for="delayMs" data-i18n="newScan.delayLabel">Delay between requests (ms)</label>
            <input class="input" type="number" id="delayMs" name="delayMs" min="0" />
          </div>
          <div class="field">
            <label for="seeds" data-i18n="newScan.seedsLabel">Extra seed URLs (one per line)</label>
            <textarea class="input" id="seeds" name="seeds" data-i18n-placeholder="newScan.seedsPlaceholder"></textarea>
          </div>
          <div class="field">
            <label for="exclusions" data-i18n="newScan.exclusionsLabel">Exclusion patterns (one glob per line)</label>
            <textarea class="input" id="exclusions" name="exclusions" data-i18n-placeholder="newScan.exclusionsPlaceholder"></textarea>
          </div>
          <div class="field">
            <label for="bookingEngineUrl" data-i18n="newScan.bookingEngineUrlLabel">Known booking engine URL (optional)</label>
            <input class="input" type="text" id="bookingEngineUrl" name="bookingEngineUrl" data-i18n-placeholder="newScan.bookingEngineUrlPlaceholder" />
          </div>
        </details>

        <button type="submit" class="btn btn-primary btn-block" id="submit-button" data-i18n="newScan.submitButton">Start scan</button>
      </form>
    </main>
    <script type="module" src="/app-new-scan.js"></script>
  </body>
</html>
