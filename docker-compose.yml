services:
  # Local MongoDB for packages/store's integration tests only. Never used
  # by the CLI itself (that reads MONGODB_URI, not this). Offset port so
  # it never collides with a developer's own local Mongo on 27017.
  mongo-test:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    ports:
      - '27018:27017'
    volumes:
      - mongo-test-data:/data/db
    # The suite opens one connection pool per worker database, and mongod
    # spends a descriptor per socket and per WiredTiger file. On the
    # inherited Docker default it eventually refuses every connection with
    # "Too many open files" and the whole store tier flakes or skips; 64000
    # is MongoDB's own production floor for exactly this reason.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

volumes:
  mongo-test-data:
