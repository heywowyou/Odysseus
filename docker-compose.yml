services:
  # Local MongoDB for packages/store's integration tests only. Never used
  # by the CLI itself (that reads MONGODB_URI, not this). Offset port so
  # it never collides with a developer's own local Mongo on 27017.
  mongo-test:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    # A single-node replica set, like production's Atlas cluster, so the one
    # multi-document transaction (report-bundle activation) runs in tests
    # instead of being skipped (issue #515). mongod listens on 27018 inside
    # the container too, so the member address it advertises,
    # localhost:27018, is the one the host connects to.
    command: ['--replSet', 'rs0', '--port', '27018', '--bind_ip_all']
    ports:
      - '27018:27018'
    # Initiates the replica set on first start; healthy once it has a primary.
    # `pnpm test:store:up` waits for it.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --port
        - '27018'
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }).ok }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mongo-test-data:/data/db
    # The suite opens one connection pool per worker database, and mongod
    # spends a descriptor per socket and per WiredTiger file. On the
    # inherited Docker default it eventually refuses every connection with
    # "Too many open files" and the whole store tier flakes or skips; 64000
    # is MongoDB's own production floor for exactly this reason.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

volumes:
  mongo-test-data:
