rules:
  - id: storage-write-outside-adapter
    languages: [typescript]
    severity: ERROR
    message: >
      new AwsClient(...) (aws4fetch's S3-signing client) constructed
      outside the approved storage modules. In the interface package every
      bucket adapter (preview publisher, artifact store, opt-out and
      reference-audit buckets) builds on createS3Bucket in s3-bucket.ts, the
      one place a client is constructed. The public site cannot import the
      interface package, so its own storage modules (site/lib/read-preview.ts,
      opt-out.ts, reference-audit-object.ts, reference-audit-receipt.ts) are
      its adapters. Bucket credentials and object-key derivation stay in
      those reviewed places - call an existing adapter (via
      configured-preview-publisher.ts in the interface) instead of signing
      requests directly.
    paths:
      include:
        - '**/packages/interface/src/**/*.ts'
        - '**/packages/site/**/*.ts'
      exclude:
        - '*.test.ts'
        - '*.e2e.test.ts'
        - '**/packages/interface/src/s3-bucket.ts'
        - '**/packages/site/lib/read-preview.ts'
        - '**/packages/site/lib/opt-out.ts'
        - '**/packages/site/lib/reference-audit-object.ts'
        - '**/packages/site/lib/reference-audit-receipt.ts'
    pattern: new AwsClient(...)
