rules:
  - id: credentials-in-logs
    languages: [typescript]
    severity: ERROR
    message: >
      A logger/console call is passed something that looks like a secret
      directly: a credential-named property access, a credential getter
      (getOpenAiApiKey/getPreviewBucketSecretKey-shaped), or the whole
      process.env. docs/agents/coding-conventions.md: "Do not log secrets,
      raw personal data, raw page HTML, or model-visible content forbidden
      by the charter." Log structured operational context instead (see
      server.ts's `logger.error({ err, method, url, requestId }, ...)` for
      the established shape) - never a raw credential value or the whole
      environment.
    patterns:
      - pattern-either:
          - pattern: logger.$METHOD($X, ...)
          - pattern: console.$METHOD($X, ...)
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-either:
                - pattern: process.env
                - pattern: $OBJ.apiKey
                - pattern: $OBJ.secretKey
                - pattern: $OBJ.secret
                - pattern: $OBJ.password
                - pattern: $OBJ.credentials
                - pattern-regex: '^get\w*(ApiKey|SecretKey|Secret|Password)\(\)$'
