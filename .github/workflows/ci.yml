name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo-test:
        image: mongo:7.0.39
        ports:
          - 27018:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check agent documentation
        run: pnpm run docs:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm --filter @odysseus/cli... run build

      # The marketing site is not a dependency of the CLI, so the filter
      # above never builds it. Its only CI exercise is here: a broken
      # build used to surface first as a failed Vercel deploy.
      - name: Build site
        run: pnpm --filter @odysseus/site run build

      - name: Test production release controller
        run: pnpm run test:deploy

      - name: Test
        # test:all runs both vitest projects (unit and e2e): the same
        # complete suite that a plain `vitest run` executed before the
        # split. `pnpm test` deliberately covers only the unit project so
        # the local loop stays fast.
        run: pnpm run test:all
        env:
          MONGODB_TEST_URI: mongodb://localhost:27018/odysseus_test
