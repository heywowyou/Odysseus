name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo-test:
        image: mongo:7.0.39
        ports:
          - 27018:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check agent documentation
        run: pnpm run docs:check

      - name: Show formatting diff
        run: |
          pnpm exec prettier --write packages/site/app/bot/page.tsx packages/site/app/confidentialite-prospection/page.tsx packages/site/app/desinscription/page.tsx packages/site/app/offre/page.tsx packages/site/app/page.tsx packages/site/lib/dossier.tsx packages/site/lib/marketing-copy.test.ts packages/site/lib/page-meta.ts
          git diff -- packages/site/app/bot/page.tsx packages/site/app/confidentialite-prospection/page.tsx packages/site/app/desinscription/page.tsx packages/site/app/offre/page.tsx packages/site/app/page.tsx packages/site/lib/dossier.tsx packages/site/lib/marketing-copy.test.ts packages/site/lib/page-meta.ts
          exit 1

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm --filter @odysseus/cli... run build

      - name: Build site
        run: pnpm --filter @odysseus/site run build

      - name: Test production release controller
        run: pnpm run test:deploy

      - name: Test
        run: pnpm run test:all
        env:
          MONGODB_TEST_URI: mongodb://localhost:27018/odysseus_test
