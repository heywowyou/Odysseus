name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: copy/public-site-native-language-pass

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format public site copy
        run: |
          pnpm exec prettier --write packages/site/app/bot/page.tsx packages/site/app/confidentialite-prospection/page.tsx packages/site/app/offre/page.tsx packages/site/app/page.tsx
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/site/app/bot/page.tsx packages/site/app/confidentialite-prospection/page.tsx packages/site/app/offre/page.tsx packages/site/app/page.tsx
          git commit -m "Format public site copy"
          git push origin HEAD:copy/public-site-native-language-pass
