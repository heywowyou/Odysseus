name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo-test:
        image: mongo:7.0.39
        ports:
          - 27018:27017
        # The job waits for a healthy service before its first step, so the
        # Mongo-backed suites never race a still-starting database.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p \"require('playwright/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}

      # Runner images can change independently of the browser cache. Keep the
      # cheap, idempotent system-package check on every run; only the browser
      # download is skipped on a cache hit.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Check agent documentation
        run: pnpm run docs:check

      - name: Check executable plan contracts
        run: pnpm run plans:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Architecture check
        run: pnpm run architecture:check

      - name: Audit code graph
        run: pnpm run audit:code

      - name: Build
        run: pnpm --filter @odysseus/cli... run build

      # The marketing site is not a dependency of the CLI, so the filter
      # above never builds it. Its only CI exercise is here: a broken
      # build used to surface first as a failed Vercel deploy.
      - name: Build site
        run: pnpm --filter @odysseus/site run build

      - name: IBM Equal Access secondary accessibility gate
        run: bash deploy/equal-access-ci.sh
        env:
          MONGODB_TEST_URI: mongodb://localhost:27018/odysseus_test
          IBM_TELEMETRY_DISABLED: 'true'

      - name: Test production release controller
        run: pnpm run test:deploy

      - name: Test
        # test:all runs all three vitest projects (unit, e2e, and the
        # serial e2e project): the same complete suite that a plain
        # `vitest run` executed before the split. `pnpm test` deliberately
        # covers only the unit project so the local loop stays fast.
        run: pnpm run test:all
        env:
          MONGODB_TEST_URI: mongodb://localhost:27018/odysseus_test
          # CI is already set by GitHub Actions; this names the intent: an
          # unreachable test database fails the run instead of skipping.
          REQUIRE_MONGO_TESTS: '1'

  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    # Issue #255. Two passes over the same repository filesystem scan
    # (dependency manifests, secrets across every text file including
    # deploy/compose.yaml, and Dockerfile misconfiguration): a non-gating
    # report at every severity so lower-severity findings stay visible, then
    # a gate that fails only on actionable HIGH/CRITICAL findings with a
    # known fix. Known upstream gap, not a config error here: Trivy's
    # misconfig scanner has no ruleset for Compose's schema (Dockerfile and
    # Containerfile only, confirmed against its own docs), so
    # deploy/compose.yaml gets secret scanning but not structural
    # misconfiguration checks. Vendored agent-tooling trees (.agents,
    # .claude, .codex, .zcode) are excluded for the same reason the
    # Dockerfile's build context excludes them: they are not shipped
    # product code, and scanning them is pure noise. data/artifacts/reports/
    # coverage/.pnpm-store are gitignored local-only output (data/ in
    # particular holds multi-gigabyte Sirene source CSVs on a developer
    # machine) that a checkout never has, listed here so the same skip-dirs
    # value is safe to reuse verbatim for a local run. .env/.env.smoke are
    # this repo's designated real-secret store (gitignored, never checked
    # out here either): scanning them is not this gate's job and would make
    # a local run flag a developer's own working credentials every time.
    steps:
      - uses: actions/checkout@v4

      - name: Trivy report (all severities, non-gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.agents,.claude,.codex,.zcode,data,artifacts,reports,coverage,.pnpm-store
          skip-files: .env,.env.smoke,.restic.env,.restic-password
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Trivy gate (HIGH/CRITICAL with a known fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.agents,.claude,.codex,.zcode,data,artifacts,reports,coverage,.pnpm-store
          skip-files: .env,.env.smoke,.restic.env,.restic-password
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Verify the secret-scanning gate against a synthetic fixture
        # Proves the gate above actually fires, without committing anything
        # that looks like a real credential (deploy/trivy-secret-gate.test.sh
        # generates and scans a throwaway fixture, never checked into git).
        run: bash deploy/trivy-secret-gate.test.sh

  security-scan-image:
    name: Security scan production image (Trivy)
    # Issue #255. Only on main: builds the same image the deploy pipeline
    # ships, scans it, and publishes a software bill of materials. Gated
    # behind the test job so a broken commit never pays for an image build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t odysseus-app:ci-scan .

      - name: Trivy image report (all severities, non-gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: odysseus-app:ci-scan
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Trivy image gate (HIGH/CRITICAL with a known fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: odysseus-app:ci-scan
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: odysseus-app:ci-scan
          format: cyclonedx
          output: odysseus-image.sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-image-sbom-${{ github.sha }}
          path: odysseus-image.sbom.cdx.json
          retention-days: 90

  security-scan-semgrep:
    name: Custom Semgrep rules (Odysseus seams)
    runs-on: ubuntu-latest
    # Issue #261. Narrow, hand-written rules for risk seams a generic
    # ruleset can't express: the prospecting SSRF guard (checkFetchTarget),
    # shell-interpreting exec()/execSync(), a credential reaching a log
    # line, a raw preview-token comparison, and a storage write bypassing
    # the approved PreviewPublisher/ArtifactStore adapter. Deliberately
    # just these five, not a community pack (config:auto or a p/ registry
    # ruleset) - baseline results get reviewed before any of that is added.
    # Every rule under .semgrep/rules/ has positive and negative fixtures
    # under .semgrep/fixtures/, verified by .semgrep/test-rules.py before
    # the real scan runs: a fixture-test failure means a rule regressed,
    # not that product code did. Both steps invoke the same pinned image
    # docker run invocation used to develop and validate these rules
    # locally, so "it worked when I wrote it" and "it works in CI" are the
    # same command. Semgrep CE analyzes one file at a time - no cross-file
    # import resolution or dataflow - so each rule's own message documents
    # the specific false-positive/negative shape that limitation leaves
    # open in this repo; see docs/agents/coding-conventions.md, "Custom
    # Semgrep rules".
    steps:
      - uses: actions/checkout@v4

      - name: Verify custom rule fixtures
        run: python3 .semgrep/test-rules.py semgrep/semgrep:1.145.0

      - name: Scan with the Odysseus custom Semgrep rules
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.145.0 \
            semgrep scan --config /src/.semgrep/rules --error \
            --sarif --output /src/semgrep-odysseus.sarif.json \
            /src/packages /src/scripts

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-odysseus.sarif.json
