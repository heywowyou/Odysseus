name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  production:
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.odysseusaudit.com
    env:
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ vars.PRODUCTION_USER }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Check deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Check out the verified commit
        if: inputs.operation == 'deploy'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Require successful CI for this commit
        if: inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matching_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=100 \
            --jq ".workflow_runs | map(select(.head_sha == \"$RELEASE_SHA\")) | length")"
          test "$matching_runs" -gt 0
          printf 'CI verified for %s\n' "$RELEASE_SHA"

      - name: Configure restricted SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/production
          chmod 0600 ~/.ssh/production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy verified commit
        if: inputs.operation == 'deploy'
        run: |
          set -euo pipefail
          git archive --format=tar.gz "$RELEASE_SHA" |
            ssh -i ~/.ssh/production \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              "$PRODUCTION_USER@$PRODUCTION_HOST" "deploy $RELEASE_SHA"

      - name: Roll back one release
        if: inputs.operation == 'rollback'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/production \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" rollback < /dev/null

      - name: Verify the public login boundary
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 10 \
            --write-out '%{http_code} %{redirect_url}' \
            https://app.odysseusaudit.com/)"
          test "$response" = '302 https://app.odysseusaudit.com/login'
          printf 'Production verified: %s\n' "$response"
